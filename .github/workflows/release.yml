name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify tag matches package version
        run: node -e "const v = require('./package.json').version; if (process.env.GITHUB_REF_NAME !== 'v' + v) { console.error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match package.json v' + v); process.exit(1); }"
      - name: Verify plugin
        run: npm run verify
      - name: Build package
        run: npm pack
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-safe-delete-tool
          path: dsh-safe-delete-tool-*.tgz
          if-no-files-found: error
